model_options:
  target: isFraud
  drop_columns:
    - TransactionID
    - TransactionDT
  split_strategy: time_ordered
  time_column: TransactionDT
  test_size: 0.2
  random_state: 42
  stratify: true

baseline_model_options:
  model_name: LogisticRegression
  random_state: 42
  class_weight: balanced
  max_iter: 1000
  solver: lbfgs
  rare_min_frequency: 0.005

tree_model_options:
  model_name: RandomForestClassifier
  n_estimators: 100
  max_depth: 10
  random_state: 42
  class_weight: balanced

lightgbm_model_options:
  model_name: LGBMClassifier
  objective: binary
  metric: average_precision
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  random_state: 42
  n_jobs: -1
  class_weight: balanced
  rare_min_frequency: 0.005
  verbosity: -1

xgboost_model_options:
  model_name: XGBClassifier
  objective: "binary:logistic"
  eval_metric: aucpr
  n_estimators: 700
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  tree_method: hist
  rare_min_frequency: 0.005

threshold_options:
  target: isFraud
  inner_validation_fraction: 0.2
  threshold_start: 0.05
  threshold_stop: 0.95
  threshold_step: 0.01

feature_grouping:
  id_like_numeric:
    - card1
    - card2
    - card3
    - card5
    - addr1
    - addr2
  known_categorical:
    - ProductCD
    - card4
    - card6
    - P_emaildomain
    - R_emaildomain
    - DeviceType
    - DeviceInfo
    - M1
    - M2
    - M3
    - M4
    - M5
    - M6
    - M7
    - M8
    - M9
  exclude_from_features:
    - TransactionID
    - isFraud
    - TransactionDT
