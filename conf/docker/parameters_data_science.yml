xgboost_model_options:
  model_name: XGBClassifier
  objective: "binary:logistic"
  eval_metric: aucpr
  n_estimators: 700
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  tree_method: hist
  rare_min_frequency: 0.005
  numeric_dtype: float32
